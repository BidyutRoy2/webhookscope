name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Demo verdict smoke check
        run: |
          node -e "import('./src/autopsy.js').then(async m => { const fs = await import('node:fs'); const c = JSON.parse(fs.readFileSync('data/claimants.json','utf8')); const fx = JSON.parse(fs.readFileSync('tests/fixtures/stolen-n8n-demo.json','utf8')); const d = m.diagnose({info: fx.info}, c); if (d.verdict !== 'WEBHOOK_STOLEN' || d.confidence !== 'high') { console.error('demo verdict failed', d); process.exit(1); } console.log('demo verdict OK:', d.label); });"
      - name: Check static files exist
        run: test -f index.html && test -f vercel.json && test -f data/claimants.json && test -f assets/css/style.css && test -f assets/js/app.js
